# Setup
title:               shenyaojin.github.io
tagline:             Shenyao's Github page
description:         Shenyao Jin's personal website and research blog — distributed fiber-optic sensing (DAS/DSS) and geophysics.
url:                 "https://shenyaojin.github.io"
baseurl:             ''
paginate:            5
paginate_path:       "/blog/page:num" 
permalink:           /:categories/:title/

markdown: kramdown

# About/contact
author:
  name:              Shenyao Jin
  url:               https://shenyaojin.github.io
  email:             shenyaojin@mines.edu
# Gems
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Keep the historical feed URL so existing subscribers don't break
feed:
  path: atom.xml

# Custom vars
version:             1.2.0
google_analytics_id: #UA-XXXX-Y
